name: Deploy visualization

on:
  push:
    branches:
      - main
    paths:
      - cloud/visualization/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-visualization
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy til VPS
    runs-on: ubuntu-latest
    env:
      REMOTE_PATH: ${{ secrets.VPS_PATH }}
      LIVE_URL: https://aitsm.vps.webdock.cloud/

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installér Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/visualization/package-lock.json

      - name: Installér afhængigheder
        run: npm ci
        working-directory: cloud/visualization

      - name: Lint
        run: npm run lint
        working-directory: cloud/visualization

      - name: Byg frontend
        run: npm run build
        working-directory: cloud/visualization

      - name: Installér PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Valider PHP
        run: php -l cloud/visualization/public/api.php

      - name: Konfigurér SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "Secret VPS_SSH_KEY mangler" >&2; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Secret VPS_KNOWN_HOSTS mangler" >&2; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy cloud/visualization
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "Secret VPS_HOST mangler" >&2; exit 1; }
          test -n "$VPS_USER" || { echo "Secret VPS_USER mangler" >&2; exit 1; }
          test -n "$REMOTE_PATH" || { echo "Secret VPS_PATH mangler" >&2; exit 1; }
          REMOTE_PATH="${REMOTE_PATH%/}"

          SSH_OPTIONS="-i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22} -o BatchMode=yes"
          ssh $SSH_OPTIONS "$VPS_USER@$VPS_HOST" "mkdir -p '$REMOTE_PATH'"
          rsync --recursive --compress --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh $SSH_OPTIONS" \
            cloud/visualization/dist/ "$VPS_USER@$VPS_HOST:$REMOTE_PATH/"

      - name: Opdater Nginx-konfiguration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          REMOTE_PATH="${REMOTE_PATH%/}"
          SSH_OPTIONS="-i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22} -o BatchMode=yes"

          # Læg den versionsstyrede snippet i deploy-mappen ...
          rsync --compress \
            -e "ssh $SSH_OPTIONS" \
            cloud/visualization/deploy/nginx-visualization.conf \
            "$VPS_USER@$VPS_HOST:$REMOTE_PATH/nginx-visualization.conf"

          # ... og lad det root-ejede wrapper-script installere den og reload Nginx.
          ssh $SSH_OPTIONS "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/bin/aitsm-deploy-nginx"

      - name: Test live website
        run: |
          set -eu
          base="${LIVE_URL%/}"

          # 1) Forsiden skal være bygget HTML med React-root.
          html="$(curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 20 "$base/")"
          printf '%s' "$html" | grep -q 'id="root"' \
            || { echo "Forsiden indeholder ikke React-root" >&2; exit 1; }

          # 2) Alle assets, som forsiden refererer, skal kunne hentes.
          assets="$(printf '%s' "$html" | grep -oE '\./assets/[^"]+' | sort -u)"
          test -n "$assets" || { echo "Fandt ingen assets i index.html" >&2; exit 1; }
          for asset in $assets; do
            echo "Tjekker ${asset#./}"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 --max-time 20 \
              "$base/${asset#./}" > /dev/null
          done

          # 3) Favicon og forsiden.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --max-time 20 \
            "$base/favicon.svg" > /dev/null

          # 4) API'et er ikke-fatalt: QuestDB kan være midlertidigt nede,
          #    og siden håndterer det selv.
          api_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 20 "$base/api.php?page_size=1" || true)"
          echo "api.php -> HTTP ${api_code:-000}"
          if [ "${api_code:-000}" != "200" ]; then
            echo "::warning::api.php svarede HTTP ${api_code:-000} (ikke-fatalt)"
          fi
