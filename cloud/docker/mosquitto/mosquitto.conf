# Mosquitto i Docker. Svarer til /etc/mosquitto/conf.d/aitsm.conf på værten,
# men lytter på alle interfaces i containeren; compose.yml bestemmer, hvad
# der er tilgængeligt udefra. Se cloud/mqtt/README.md om per_listener_settings.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt

listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
