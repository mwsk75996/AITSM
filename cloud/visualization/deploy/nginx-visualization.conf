# Project C visualization (React + Vite build).
#
# Denne fils indhold installeres til /etc/nginx/snippets/aitsm-visualization.conf
# af /usr/local/bin/aitsm-deploy-nginx og inkluderes fra serverens vhost.
# Redigér kilden i repoet – ikke filen direkte på serveren.

# Forsiden: bygget index.html ligger uden for webroot.
location = / {
  root /var/www/html/projekt-c/cloud/visualization;
  try_files /index.html =404;
  default_type text/html;
  add_header Cache-Control "no-cache";
}

location = /favicon.svg {
  alias /var/www/html/projekt-c/cloud/visualization/favicon.svg;
  default_type image/svg+xml;
  add_header Cache-Control "public, max-age=3600";
}

# Vite-assets har indholds-hash i filnavnet og kan caches længe.
location /assets/ {
  alias /var/www/html/projekt-c/cloud/visualization/assets/;
  access_log off;
  expires 1y;
  add_header Cache-Control "public, immutable";
}

location = /api.php {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/html/projekt-c/cloud/visualization/api.php;
  fastcgi_param SCRIPT_NAME /api.php;
  fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
  fastcgi_connect_timeout 3;
  fastcgi_read_timeout 10;
}

# Bagudkompatibel API-sti: eksponerer kun det read-only endpoint.
location = /api/data.php {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/html/projekt-c/cloud/visualization/api.php;
  fastcgi_param SCRIPT_NAME /api/data.php;
  fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
  fastcgi_connect_timeout 3;
  fastcgi_read_timeout 10;
}

# Eksponér ikke projektfilerne direkte – kun de eksplicitte locations ovenfor.
location = /projekt-c { return 404; }
location ^~ /projekt-c/ { deny all; }
