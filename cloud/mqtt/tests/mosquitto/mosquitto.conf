# Isolated test broker only. Never install on the VPS.
# Same security mode as the VPS: with per_listener_settings true, Mosquitto
# 2.0 denies the ACL check for disconnected clients and drops the QoS 1
# messages queued for the offline ingest session.
per_listener_settings false
allow_anonymous true
acl_file /mosquitto/config/acl
listener 1883
persistence false
max_queued_messages 1000
