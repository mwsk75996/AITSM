# Logging to the serial console
CONFIG_LOG=y

# Kernel objects used between the threads (k_event; k_msgq and k_sem are always available)
CONFIG_EVENTS=y

# Cellular modem: NB-IoT only on the supplied SIM card
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_NBIOT=y

# Low power: request PSM so the modem sleeps between the batches. The MQTT
# keepalive is longer than the 5 minutes between batches, so keepalive pings do
# not wake the modem in between.
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_SECONDS=y
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=3600
CONFIG_LTE_PSM_REQ_RAT_SECONDS=10
CONFIG_MQTT_KEEPALIVE=1200

# Sockets are handled by the modem
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# MQTT over TLS; the CA certificate is stored in the modem under sec tag 42
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_PORT=8883
CONFIG_MQTT_HELPER_SEC_TAG=42
CONFIG_MODEM_KEY_MGMT=y

# Measurements: modem temperature, battery voltage (nPM1300) and UTC time from the network
CONFIG_MODEM_INFO=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_MODEM=y
CONFIG_DATE_TIME_NTP=n

# RGB LED that shows the connection status (PWM); set CONFIG_AITSM_LED=n to keep it off
CONFIG_PWM=y
CONFIG_AITSM_LED=y

# SparkplugB payloads are protobuf, encoded with nanopb
CONFIG_NANOPB=y

# The application thread (main) does the TLS connect and the protobuf encoding
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Data profile: measure every 15 s and send 20 measurements together
CONFIG_AITSM_MEASUREMENT_INTERVAL_SECONDS=15
CONFIG_AITSM_BATCH_SIZE=20
CONFIG_AITSM_BATCH_CAPACITY=28
