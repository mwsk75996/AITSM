; Modbus TCP side project (#93): two ESP32s on the same WiFi.
; slave:  reads a DS18B20 on GPIO 4 and serves it as Modbus input registers
; master: polls the slave over Modbus TCP and logs the temperature
;
; Build and flash from this folder:
;   pio run -e slave -t upload --upload-port /dev/ttyUSB0
;   pio run -e master -t upload --upload-port /dev/ttyUSB1

[platformio]
default_envs = slave, master

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Isrc/common

[env:slave]
build_src_filter = +<common/> +<slave/>
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.5
	miq19/eModbus@^1.7.4

[env:master]
build_src_filter = +<common/> +<master/>
lib_deps =
	miq19/eModbus@^1.7.4
