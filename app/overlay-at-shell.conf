# Test overlay: AT commands over the USB serial console.
#
# Used for hardware tests (issue #12), e.g. simulating an LTE outage with
# "at AT+CFUN=4" followed by "at AT+CFUN=1". Not part of the standard build.
#
# west build -b thingy91x/nrf9151/ns -d build/thingy91x_at_shell app \
#   -- -DEXTRA_CONF_FILE=overlay-at-shell.conf

CONFIG_SHELL=y
CONFIG_AT_SHELL=y
# AT queries contain '?'; shell wildcard expansion would consume them.
CONFIG_SHELL_WILDCARD=n
# "kernel reboot cold" for a clean start before each test.
CONFIG_REBOOT=y
CONFIG_SHELL_STACK_SIZE=3072
