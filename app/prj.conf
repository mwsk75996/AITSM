CONFIG_GPIO=y
CONFIG_PWM=y
# Network, MQTT and cellular modem support
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_LOG=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_MODEM_INFO=y
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_MODEM=y
CONFIG_DATE_TIME_NTP=n
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_PORT=8883
CONFIG_MQTT_HELPER_SEC_TAG=42
CONFIG_MODEM_KEY_MGMT=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y

# NB-IoT only: the device must not fall back to LTE-M (see issue #25).
CONFIG_LTE_NETWORK_MODE_NBIOT=y

# Low power (#23): request PSM so the modem sleeps between batch uploads. The
# MQTT keepalive is longer than the batch interval (300 s), so keepalive pings
# do not wake the modem in between; the batches themselves keep the connection
# and the operator's NAT mapping alive.
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_SECONDS=y
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=3600
CONFIG_LTE_PSM_REQ_RAT_SECONDS=10
CONFIG_MQTT_KEEPALIVE=1200

# LTE and modem libraries need more heap/stack than the LED-only application.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# Data/transmission profile (issues #30-31).
CONFIG_AITSM_TRANSMISSION_BATCH=y
CONFIG_AITSM_MEASUREMENT_INTERVAL_SECONDS=15
CONFIG_AITSM_BATCH_INTERVAL_SECONDS=300
CONFIG_AITSM_BATCH_MAX_SAMPLES=20
CONFIG_NANOPB=y
